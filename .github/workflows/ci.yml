name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile, test, and type-check
        run: npm run check
      - name: Check out pinned Wallet integration suite
        uses: actions/checkout@v4
        with:
          repository: FordPerfect2027/ThreeCore-Wallet
          ref: 1ec47f1d5c4b709932f9ae1c1f4768a33053c50b
          path: .wallet-integration
          persist-credentials: false
      - name: Verify current token with Wallet on both simulated chain IDs
        run: node --test .wallet-integration/integration/token-compatibility.test.mjs
